[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoquery"
version = "0.1.0"
description = "EchoQuery multilingual speech-to-grounded-answer application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "qdrant-client>=1.12,<2",
  "pyarrow>=17,<20",
  "fsspec>=2024.6,<2026",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "pytest>=8,<9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["03-ai-rag-engine", "06-evaluation"]
testpaths = ["03-ai-rag-engine/tests"]
