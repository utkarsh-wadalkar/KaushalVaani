map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream echoquery_api {
  server 127.0.0.1:8000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name __API_HOSTNAME__;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name __API_HOSTNAME__;

  ssl_certificate /etc/letsencrypt/live/__API_HOSTNAME__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__API_HOSTNAME__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  client_max_body_size 16m;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  location = /health {
    proxy_pass http://echoquery_api/health;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location /api/ {
    proxy_pass http://echoquery_api;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;
  }

  location /ws {
    proxy_pass http://echoquery_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }
}
