services:
  api:
    build:
      context: ../..
      dockerfile: 08-infrastructure/docker/Dockerfile.api
    env_file:
      - /etc/echoquery/api.env
    environment:
      INDEX_SNAPSHOT: /app/data/indexes/index.json
    expose:
      - "8000"
    volumes:
      - ../../05-data/indexes:/app/data/indexes:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [echoquery]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
    networks: [echoquery]

networks:
  echoquery:
    driver: bridge

volumes:
  qdrant_data:
